# Production additions to docker-compose.yml (ADR-0021, steps 9.2 and 9.3): Nginx
# in front of the frontend and the backend on one origin, certificates from
# Let's Encrypt, no published ports but Nginx's, rotated logs. On the server
# COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml in .env makes a plain
# `docker compose up -d --build` use both files (DEPLOY.md).
#
# Secrets stay in .env (mode 600, not in git), read by backend, migrate and
# github-worker only; postgres gets its three values, the rest gets none.

# Without rotation json-file logs grow until the disk is full.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  # Reached only from the internal network: `docker compose exec postgres psql`.
  postgres:
    ports: !reset []
    logging: *logging

  migrate:
    logging: *logging

  github-worker:
    logging: *logging

  backend:
    # Only through Nginx (ADR-0021).
    ports: !reset []
    logging: *logging
    environment:
      # Only Nginx may set X-Forwarded-For and X-Forwarded-Proto: uvicorn reads
      # this variable and ignores the headers from any other address.
      FORWARDED_ALLOW_IPS: ${NGINX_IP:-172.30.10.10}

  # Built for one address: NEXT_PUBLIC_API_URL is inlined into the bundle. No
  # env_file: the frontend needs none of the backend's secrets.
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://${SERVER_NAME:?set SERVER_NAME in .env (docker-compose.prod.yml)}
        API_INTERNAL_URL: http://backend:8000
    container_name: developer-platform-frontend
    logging: *logging
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    container_name: developer-platform-nginx
    logging: *logging
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:?set SERVER_NAME in .env (docker-compose.prod.yml)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
      # Screenshots written by the backend (ADR-0022); Nginx only reads them.
      - media:/srv/media:ro
    networks:
      default:
        ipv4_address: ${NGINX_IP:-172.30.10.10}
    depends_on:
      - backend
      - frontend

  # Renews the certificate twice a day (a no-op until 30 days before expiry);
  # Nginx reloads it every 6 hours. The first one is issued by hand (DEPLOY.md).
  certbot:
    image: certbot/certbot:v5.1.0
    container_name: developer-platform-certbot
    logging: *logging
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt

  # A backup of the database and the media volume once a day and at every start,
  # to the restic repository off this host (ADR-0026, DEPLOY.md). deploy.sh runs
  # one more before an update with a migration.
  backup:
    build:
      context: ./backup
    container_name: developer-platform-backup
    logging: *logging
    restart: unless-stopped
    environment: &backup-environment
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?set RESTIC_REPOSITORY in .env (DEPLOY.md)}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?set RESTIC_PASSWORD in .env (DEPLOY.md)}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
    command:
      - /bin/sh
      - -c
      - trap exit TERM; while :; do backup.sh || echo "backup failed"; sleep 86400 & wait $${!}; done
    volumes:
      - media:/srv/media:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Only by hand, with backend and github-worker stopped: `docker compose run
  # --rm restore [snapshot]` (DEPLOY.md, "Восстановление"). Writes the volume.
  restore:
    image: ${COMPOSE_PROJECT_NAME}-backup
    pull_policy: never
    profiles: [restore]
    logging: *logging
    environment: *backup-environment
    entrypoint: ["restore.sh"]
    volumes:
      - media:/srv/media
    depends_on:
      postgres:
        condition: service_healthy

networks:
  # A fixed subnet gives Nginx a fixed address to trust (FORWARDED_ALLOW_IPS).
  default:
    ipam:
      config:
        - subnet: ${INTERNAL_SUBNET:-172.30.10.0/24}

volumes:
  certbot_www:
  certbot_certs:
