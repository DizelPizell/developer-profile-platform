[project]
name = "developer-profile-platform-backend"
version = "0.1.0"
description = "Developer Profile Platform backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "sqlalchemy>=2.1.6",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.1",
    "pydantic-settings>=2.16.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "ruff>=0.17.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
