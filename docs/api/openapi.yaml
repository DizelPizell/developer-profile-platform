openapi: 3.0.3
info:
  title: Developer Professional Profile Platform API
  version: 1.0.0
  description: Preliminary V1 API contract.
servers:
  - url: /api/v1
paths:
  /auth/github/login:
    get:
      security: []
      summary: Start GitHub OAuth login
      description: Sets the HttpOnly `oauth_state` cookie and redirects to GitHub.
      responses:
        "302": {description: Redirect to GitHub}
        "500": {$ref: "#/components/responses/InternalError"}
  /auth/github/callback:
    get:
      security: []
      summary: GitHub OAuth login callback
      description: >-
        On success sets the session cookie and redirects to FRONTEND_URL. On any
        error redirects to `{FRONTEND_URL}/login?error=<CODE>` without a JSON
        body and without a session cookie; CODE is one of ACCESS_DENIED,
        INVALID_STATE, MISSING_CODE, OAUTH_CODE_INVALID, GITHUB_UNAVAILABLE,
        INTERNAL_ERROR. Nothing from the request or from GitHub is copied into
        the URL. The `oauth_state` cookie is deleted on every response.
      parameters:
        - {name: code, in: query, required: false, schema: {type: string}}
        - {name: state, in: query, required: false, schema: {type: string}}
        - {name: error, in: query, required: false, schema: {type: string}}
      responses:
        "302":
          description: >-
            Redirect to FRONTEND_URL after login, or to
            `{FRONTEND_URL}/login?error=<CODE>` on error
          headers:
            Location:
              schema: {type: string}
            X-Request-ID: {$ref: "#/components/headers/X-Request-ID"}
  /auth/logout:
    post:
      security: []
      summary: Logout
      description: Deletes the current session (if any) and clears the session cookie.
      responses:
        "204": {description: Logged out}
        "403": {$ref: "#/components/responses/OriginInvalid"}
        "500": {$ref: "#/components/responses/InternalError"}
  /auth/me:
    get:
      security: [{cookieAuth: []}]
      summary: Current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MeResponse"}
        "401":
          description: UNAUTHORIZED — no valid session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500": {$ref: "#/components/responses/InternalError"}
  /profile:
    get:
      security: [{cookieAuth: []}]
      summary: Get own profile
      description: Requires a session; always the current user's profile.
      responses:
        "200": {$ref: "#/components/responses/OwnProfile"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}
    patch:
      security: [{cookieAuth: []}]
      summary: Update own profile
      description: >-
        Partial update: fields present in the body change, null clears a field,
        unknown fields (including slug, status, avatar_url) are rejected. Values
        are trimmed, blank becomes null, control characters are rejected (bio
        allows newlines); single-line fields also reject U+2028 and U+2029.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProfileUpdate"}
      responses:
        "200": {$ref: "#/components/responses/OwnProfile"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/OriginInvalid"}
        "422":
          description: >-
            VALIDATION_ERROR (see ValidationError), or PROFILE_INCOMPLETE when
            the change would clear display_name or headline of a published profile
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500": {$ref: "#/components/responses/InternalError"}
  /profile/publish:
    post:
      security: [{cookieAuth: []}]
      summary: Publish profile
      description: Idempotent; requires non-empty display_name and headline.
      responses:
        "200": {$ref: "#/components/responses/OwnProfile"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/OriginInvalid"}
        "422": {$ref: "#/components/responses/ProfileIncomplete"}
        "500": {$ref: "#/components/responses/InternalError"}
  /profile/unpublish:
    post:
      security: [{cookieAuth: []}]
      summary: Unpublish profile
      description: Idempotent; returns the profile to PRIVATE.
      responses:
        "200": {$ref: "#/components/responses/OwnProfile"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/OriginInvalid"}
        "500": {$ref: "#/components/responses/InternalError"}
  /public/profiles/{slug}:
    get:
      security: []
      summary: Get public profile
      description: >-
        PUBLISHED profiles only; the slug is case-insensitive. Private, missing
        and malformed slugs return the same 404 as an unknown URL. Includes the
        profile's PUBLISHED + PUBLIC projects as `featured` and `other`
        (ADR-015); each project carries a nullable `github` object (ADR-019).
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicProfileResponse"}
        "404":
          description: NOT_FOUND
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500": {$ref: "#/components/responses/InternalError"}
  /projects:
    get:
      security: [{cookieAuth: []}]
      summary: List own projects
      description: >-
        Requires a session; only the current user's projects, newest first, at
        most 50 (the project limit), no pagination. See ADR-015.
      responses:
        "200":
          description: Own projects
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectListResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      security: [{cookieAuth: []}]
      summary: Create project
      description: >-
        Creates a DRAFT + PRIVATE project. Any subset of the fields, including
        none. Values are normalized as in PATCH.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectWrite"}
      responses:
        "201": {$ref: "#/components/responses/Project"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/OriginInvalid"}
        "409":
          description: PROJECT_LIMIT_REACHED — the user already has 50 projects
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
              example:
                error:
                  code: PROJECT_LIMIT_REACHED
                  message: Project limit reached
                  details: {limit: 50}
                  request_id: 3f1c2a9e-8f7b-4c1d-9a7e-2b6f0c4d5e61
        "422": {$ref: "#/components/responses/ValidationError"}
        "500": {$ref: "#/components/responses/InternalError"}
  /projects/{id}:
    parameters:
      - {$ref: "#/components/parameters/ProjectId"}
    get:
      security: [{cookieAuth: []}]
      summary: Get own project
      responses:
        "200": {$ref: "#/components/responses/Project"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
    patch:
      security: [{cookieAuth: []}]
      summary: Update own project
      description: >-
        Partial update: fields present in the body change, null clears a field,
        unknown fields (including status and visibility) are rejected. Text
        values are trimmed, blank becomes null, control characters are rejected
        (description, problem, results and contribution allow newlines); title,
        summary and role also reject U+2028 and U+2029.
        `technologies` replaces the whole list in the given order.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectWrite"}
      responses:
        "200": {$ref: "#/components/responses/Project"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/OriginInvalid"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422":
          description: >-
            VALIDATION_ERROR (see ValidationError), or PROJECT_INCOMPLETE when
            the change would empty a field required for publication of a
            PUBLISHED project
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      security: [{cookieAuth: []}]
      summary: Delete own project
      description: >-
        Hard delete in any state. Removes the project from featured projects
        and moves the remaining ones up.
      responses:
        "204": {description: Deleted}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/OriginInvalid"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /projects/{id}/publish:
    parameters:
      - {$ref: "#/components/parameters/ProjectId"}
    post:
      security: [{cookieAuth: []}]
      summary: Publish project
      description: >-
        DRAFT or ARCHIVED → PUBLISHED + PUBLIC. Requires title, summary, role,
        contribution and at least one technology. Already PUBLISHED: 200 without
        changes (a hidden project stays hidden).
      responses:
        "200": {$ref: "#/components/responses/Project"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/OriginInvalid"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ProjectIncomplete"}
        "500": {$ref: "#/components/responses/InternalError"}
  /projects/{id}/archive:
    parameters:
      - {$ref: "#/components/parameters/ProjectId"}
    post:
      security: [{cookieAuth: []}]
      summary: Archive project
      description: >-
        PUBLISHED → ARCHIVED + PRIVATE; removes the project from featured
        projects. Already ARCHIVED: 200 without changes.
      responses:
        "200": {$ref: "#/components/responses/Project"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/OriginInvalid"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/ProjectTransitionInvalid"}
        "500": {$ref: "#/components/responses/InternalError"}
  /projects/{id}/visibility:
    parameters:
      - {$ref: "#/components/parameters/ProjectId"}
    post:
      security: [{cookieAuth: []}]
      summary: Change project visibility
      description: >-
        Only while PUBLISHED. The same value: 200 without changes. PRIVATE
        removes the project from featured projects.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectVisibilityUpdate"}
      responses:
        "200": {$ref: "#/components/responses/Project"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/OriginInvalid"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/ProjectTransitionInvalid"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "500": {$ref: "#/components/responses/InternalError"}
  /projects/{id}/showcase:
    parameters:
      - {$ref: "#/components/parameters/ProjectId"}
    post:
      security: [{cookieAuth: []}]
      summary: Feature project
      description: >-
        Adds the project as the last featured project. Only PUBLISHED + PUBLIC
        projects; at most three per profile. Already featured: 200 without
        changes.
      responses:
        "200": {$ref: "#/components/responses/FeaturedProjects"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/OriginInvalid"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: >-
            PROJECT_NOT_FEATURABLE (details.status, details.visibility) or
            FEATURED_LIMIT_REACHED (details.limit = 3)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
              examples:
                notFeaturable:
                  value:
                    error:
                      code: PROJECT_NOT_FEATURABLE
                      message: Only a published public project can be featured
                      details: {status: DRAFT, visibility: PRIVATE}
                      request_id: 3f1c2a9e-8f7b-4c1d-9a7e-2b6f0c4d5e61
                limitReached:
                  value:
                    error:
                      code: FEATURED_LIMIT_REACHED
                      message: Featured project limit reached
                      details: {limit: 3}
                      request_id: 3f1c2a9e-8f7b-4c1d-9a7e-2b6f0c4d5e61
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      security: [{cookieAuth: []}]
      summary: Unfeature project
      description: >-
        Removes the project from featured projects; the remaining ones move up.
        Not featured: 200 without changes.
      responses:
        "200": {$ref: "#/components/responses/FeaturedProjects"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/OriginInvalid"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /profile/featured-projects/reorder:
    post:
      security: [{cookieAuth: []}]
      summary: Reorder featured projects
      description: >-
        The body is the complete current featured set in the new order.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FeaturedReorderRequest"}
      responses:
        "200": {$ref: "#/components/responses/FeaturedProjects"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/OriginInvalid"}
        "409":
          description: >-
            FEATURED_ORDER_MISMATCH — the list is not the current featured set;
            the client should reload
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "500": {$ref: "#/components/responses/InternalError"}
  /projects/{id}/repository:
    parameters:
      - {$ref: "#/components/parameters/ProjectId"}
    post:
      security: [{cookieAuth: []}]
      summary: Link project to a GitHub repository
      description: >-
        Reads the public repository and, unless the developer owns it, up to 5
        pages of its contributors from GitHub, then links it with the relation
        OWNER or CONTRIBUTOR and queues a sync (ADR-017, ADR-018). Replaces the
        project's previous link; the same repository again re-checks the
        relation. On any error nothing is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RepositoryLinkRequest"}
      responses:
        "200": {$ref: "#/components/responses/Project"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/OriginInvalid"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/GitHubRepositoryAlreadyLinked"}
        "422":
          description: >-
            VALIDATION_ERROR (see ValidationError); GITHUB_REPOSITORY_NOT_FOUND
            — the repository does not exist or is not public;
            GITHUB_RELATION_NOT_FOUND — the developer is neither its owner nor
            in its contributor list according to GitHub
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/GitHubUserLimitReached"}
        "500": {$ref: "#/components/responses/InternalError"}
        "502": {$ref: "#/components/responses/GitHubUnavailable"}
        "503": {$ref: "#/components/responses/GitHubRateLimited"}
    delete:
      security: [{cookieAuth: []}]
      summary: Unlink project from its GitHub repository
      description: >-
        Removes the link; the shared repository data stays. Not linked: 200
        without changes.
      responses:
        "200": {$ref: "#/components/responses/Project"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/OriginInvalid"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /integrations/github/repositories:
    get:
      security: [{cookieAuth: []}]
      summary: List own public GitHub repositories
      description: >-
        The current user's own public repositories, read from GitHub in the
        request with the app credentials (ADR-016), 100 per page, most
        recently pushed first. Not stored in the database; a page GitHub
        returned is kept in the backend's memory for 5 minutes, and whether an
        item is linked is read on every call (ADR-017). The list is read by the
        login stored at sign-in; items owned by another GitHub account are not
        returned.
      parameters:
        - name: page
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 1}
      responses:
        "200":
          description: One page of repositories
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GitHubRepositoryListResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/GitHubLoginOutdated"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/GitHubUserLimitReached"}
        "500": {$ref: "#/components/responses/InternalError"}
        "502": {$ref: "#/components/responses/GitHubUnavailable"}
        "503": {$ref: "#/components/responses/GitHubRateLimited"}
  /integrations/github/repositories/{id}/import:
    parameters:
      - {$ref: "#/components/parameters/GitHubRepoId"}
    post:
      security: [{cookieAuth: []}]
      summary: Import a GitHub repository as a project
      description: >-
        Creates a DRAFT + PRIVATE project whose title is the repository name
        (every other field empty) and links it as POST /projects/{id}/repository
        does, in one transaction (ADR-017).
      responses:
        "201": {$ref: "#/components/responses/Project"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/OriginInvalid"}
        "404":
          description: >-
            NOT_FOUND — malformed id, or the repository does not exist or is
            not public
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409":
          description: >-
            PROJECT_LIMIT_REACHED (details.limit = 50) or
            GITHUB_REPOSITORY_ALREADY_LINKED (details.project_id)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          description: >-
            GITHUB_RELATION_NOT_FOUND — the developer is neither the owner nor
            in the contributor list according to GitHub
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429": {$ref: "#/components/responses/GitHubUserLimitReached"}
        "500": {$ref: "#/components/responses/InternalError"}
        "502": {$ref: "#/components/responses/GitHubUnavailable"}
        "503": {$ref: "#/components/responses/GitHubRateLimited"}
  /integrations/github/repositories/{id}/sync:
    parameters:
      - {$ref: "#/components/parameters/GitHubRepoId"}
    post:
      security: [{cookieAuth: []}]
      summary: Request a sync of a linked repository
      description: >-
        Queues a sync job, or returns the active one. Allowed when one of the
        user's projects links the repository and no job of the repository was
        created in the last 10 minutes (ADR-018).
      responses:
        "202":
          description: Sync queued or already active
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GitHubSync"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/OriginInvalid"}
        "404":
          description: >-
            NOT_FOUND — malformed id, or none of the user's projects links
            this repository
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429":
          description: >-
            GITHUB_SYNC_TOO_SOON — the repository's latest job was created less
            than 10 minutes ago; GITHUB_USER_LIMIT_REACHED — a new job would
            exceed the user's GitHub request budget (ADR-018). Both carry
            details.retry_after_seconds
          headers:
            Retry-After:
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500": {$ref: "#/components/responses/InternalError"}
  /analytics/events:
    post:
      summary: Track analytics event
      responses:
        "202": {description: Event accepted}
  /analytics/profile:
    get:
      summary: Profile analytics
      responses:
        "200": {description: Analytics}
  /analytics/projects/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Project analytics
      responses:
        "200": {description: Analytics}
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: developer_session
      description: >-
        HttpOnly session cookie set by the GitHub login callback (ADR-012). The
        name comes from SESSION_COOKIE_NAME: developer_session in .env.example;
        without the variable the backend uses session.
  headers:
    X-Request-ID:
      description: >-
        Request id. Taken from the request's X-Request-ID header when it is a
        canonical UUID, otherwise generated. Present on every response.
      schema: {type: string, format: uuid}
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      description: >-
        Project id in the canonical 8-4-4-4-12 hex form (either case). A
        malformed id (any other form, including no hyphens, braces or a
        urn:uuid: prefix), a missing project and another user's project all
        return the same 404 NOT_FOUND.
      schema: {type: string, format: uuid}
    GitHubRepoId:
      name: id
      in: path
      required: true
      description: >-
        GitHub's numeric repository id (github_repo_id) as a positive decimal
        integer; anything else is 404 NOT_FOUND.
      schema: {type: integer, format: int64, minimum: 1}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, request_id]
          properties:
            code: {type: string, example: VALIDATION_ERROR}
            message: {type: string, example: Invalid request}
            details: {type: object, additionalProperties: true}
            request_id:
              type: string
              format: uuid
              description: Same value as the X-Request-ID response header.
    MeResponse:
      type: object
      required: [id, github_login, email, profile_slug]
      properties:
        id: {type: string, format: uuid}
        github_login: {type: string}
        email: {type: string, nullable: true}
        profile_slug: {type: string, nullable: true}
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        display_name: {type: string, maxLength: 100, nullable: true}
        headline: {type: string, maxLength: 160, nullable: true}
        bio: {type: string, maxLength: 2000, nullable: true, description: Plain text; newlines allowed}
        location: {type: string, maxLength: 100, nullable: true}
    OwnProfileResponse:
      type: object
      required: [slug, status, display_name, headline, bio, location, avatar_url, github_login]
      properties:
        slug: {type: string}
        status: {type: string, enum: [PRIVATE, PUBLISHED]}
        display_name: {type: string, nullable: true}
        headline: {type: string, nullable: true}
        bio: {type: string, nullable: true}
        location: {type: string, nullable: true}
        avatar_url: {type: string, nullable: true}
        github_login: {type: string}
    PublicProfileResponse:
      type: object
      required: [slug, display_name, headline, bio, location, avatar_url, github_login, featured, other]
      properties:
        slug: {type: string}
        display_name: {type: string, nullable: true}
        headline: {type: string, nullable: true}
        bio: {type: string, nullable: true}
        location: {type: string, nullable: true}
        avatar_url: {type: string, nullable: true}
        github_login: {type: string}
        featured:
          type: array
          maxItems: 3
          description: Featured PUBLISHED + PUBLIC projects in position order.
          items: {$ref: "#/components/schemas/PublicFeaturedProject"}
        other:
          type: array
          description: The remaining PUBLISHED + PUBLIC projects, newest first.
          items: {$ref: "#/components/schemas/PublicProject"}
    PublicProject:
      type: object
      description: Public project whitelist (ADR-015); nothing else is returned.
      required: [id, title, summary, role, technologies]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        summary: {type: string}
        role: {type: string}
        technologies:
          type: array
          description: Technology names in the developer's order.
          items: {type: string}
        github:
          type: object
          allOf: [{$ref: "#/components/schemas/PublicGitHub"}]
          nullable: true
          description: >-
            GitHub data of the linked repository; null when there is none, it
            has not been synced, it is unavailable, or the relation is lost
            (ADR-019).
    PublicGitHub:
      type: object
      description: Public GitHub whitelist (ADR-019); nothing else is returned.
      required: [full_name, html_url, description, languages, pushed_at, is_fork, parent_full_name, is_archived, relation, synced_at]
      properties:
        full_name: {type: string}
        html_url: {type: string, description: Always https://github.com/...}
        description: {type: string, nullable: true}
        languages:
          type: array
          description: Bytes of code per language as GitHub reports them, descending.
          items: {$ref: "#/components/schemas/GitHubLanguage"}
        pushed_at: {type: string, format: date-time, nullable: true}
        is_fork: {type: boolean}
        parent_full_name: {type: string, nullable: true}
        is_archived: {type: boolean}
        relation: {type: string, enum: [OWNER, CONTRIBUTOR]}
        synced_at: {type: string, format: date-time}
    GitHubLanguage:
      type: object
      required: [name, bytes]
      properties:
        name: {type: string}
        bytes: {type: integer, format: int64, minimum: 0}
    PublicFeaturedProject:
      allOf:
        - {$ref: "#/components/schemas/PublicProject"}
        - type: object
          required: [position]
          properties:
            position: {type: integer, minimum: 1, maximum: 3}
    ProjectStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]
    ProjectVisibility:
      type: string
      enum: [PUBLIC, PRIVATE]
    TechnologyName:
      type: string
      minLength: 1
      maxLength: 50
      description: >-
        Trimmed, inner whitespace collapsed to one space, no control
        characters. Compared ignoring case; an existing technology keeps its
        stored spelling.
    ProjectWrite:
      type: object
      additionalProperties: false
      description: >-
        Body of POST /projects and PATCH /projects/{id}. Any subset of the
        fields; null clears a text field. Text is plain, trimmed, blank becomes
        null.
      properties:
        title: {type: string, maxLength: 100, nullable: true}
        summary: {type: string, maxLength: 300, nullable: true}
        description: {type: string, maxLength: 5000, nullable: true, description: Plain text; newlines allowed}
        problem: {type: string, maxLength: 2000, nullable: true, description: Plain text; newlines allowed}
        results: {type: string, maxLength: 2000, nullable: true, description: Plain text; newlines allowed}
        role: {type: string, maxLength: 100, nullable: true}
        contribution: {type: string, maxLength: 2000, nullable: true, description: Plain text; newlines allowed}
        technologies:
          type: array
          maxItems: 20
          description: >-
            Replaces the whole list in this order. Names must be unique
            ignoring case. Not nullable; [] clears the list.
          items: {$ref: "#/components/schemas/TechnologyName"}
    ProjectResponse:
      type: object
      required: [id, status, visibility, title, summary, description, problem, results, role, contribution, technologies, featured_position, github]
      properties:
        id: {type: string, format: uuid}
        status: {$ref: "#/components/schemas/ProjectStatus"}
        visibility: {$ref: "#/components/schemas/ProjectVisibility"}
        title: {type: string, nullable: true}
        summary: {type: string, nullable: true}
        description: {type: string, nullable: true}
        problem: {type: string, nullable: true}
        results: {type: string, nullable: true}
        role: {type: string, nullable: true}
        contribution: {type: string, nullable: true}
        technologies: {type: array, items: {type: string}}
        featured_position: {type: integer, minimum: 1, maximum: 3, nullable: true}
        github:
          type: object
          allOf: [{$ref: "#/components/schemas/ProjectGitHub"}]
          nullable: true
          description: The linked repository, or null.
    ProjectGitHub:
      type: object
      description: The linked repository as the cabinet sees it (ADR-017, ADR-018).
      required: [github_repo_id, full_name, html_url, description, languages, pushed_at, is_fork, parent_full_name, is_archived, relation, unavailable, synced_at, sync]
      properties:
        github_repo_id: {type: integer, format: int64}
        full_name: {type: string}
        html_url: {type: string}
        description: {type: string, nullable: true}
        languages:
          type: array
          description: Empty until the first successful sync.
          items: {$ref: "#/components/schemas/GitHubLanguage"}
        pushed_at: {type: string, format: date-time, nullable: true}
        is_fork: {type: boolean}
        parent_full_name: {type: string, nullable: true}
        is_archived: {type: boolean}
        relation:
          type: string
          enum: [OWNER, CONTRIBUTOR, NONE]
          description: >-
            NONE — a sync found the developer neither owner nor contributor;
            hidden publicly until a later sync finds the relation again.
        unavailable:
          type: boolean
          description: GitHub answered 404 twice in a row; hidden publicly.
        synced_at:
          type: string
          format: date-time
          nullable: true
          description: The older of the last successful metadata and languages reads.
        sync: {$ref: "#/components/schemas/GitHubSync"}
    GitHubSync:
      type: object
      required: [status, last_success_at, next_manual_sync_at]
      properties:
        status:
          type: string
          enum: [NOT_SYNCED, QUEUED, SYNCING, SYNCED, FAILED]
          description: The latest sync job's state; NOT_SYNCED when there is none.
        last_success_at: {type: string, format: date-time, nullable: true}
        next_manual_sync_at:
          type: string
          format: date-time
          nullable: true
          description: When a manual sync is allowed again; null if allowed now.
    RepositoryLinkRequest:
      type: object
      additionalProperties: false
      required: [full_name]
      properties:
        full_name:
          type: string
          maxLength: 140
          pattern: '^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?/[A-Za-z0-9._-]{1,100}$'
          description: >-
            owner/name; the name must not be "." or "..". Checked before
            GitHub is called (ADR-016).
    GitHubRepositoryListResponse:
      type: object
      required: [items, next_page]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/GitHubRepositoryListItem"}
        next_page: {type: integer, nullable: true}
    GitHubRepositoryListItem:
      type: object
      required: [github_repo_id, full_name, html_url, description, is_fork, is_archived, pushed_at, linked_project_id]
      properties:
        github_repo_id: {type: integer, format: int64}
        full_name: {type: string}
        html_url: {type: string}
        description: {type: string, nullable: true}
        is_fork: {type: boolean}
        is_archived: {type: boolean}
        pushed_at: {type: string, format: date-time, nullable: true}
        linked_project_id:
          type: string
          format: uuid
          nullable: true
          description: The user's own project that links this repository, if any.
    ProjectSummary:
      type: object
      required: [id, status, visibility, title, summary, technologies, featured_position]
      properties:
        id: {type: string, format: uuid}
        status: {$ref: "#/components/schemas/ProjectStatus"}
        visibility: {$ref: "#/components/schemas/ProjectVisibility"}
        title: {type: string, nullable: true}
        summary: {type: string, nullable: true}
        technologies: {type: array, items: {type: string}}
        featured_position: {type: integer, minimum: 1, maximum: 3, nullable: true}
    ProjectListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: {$ref: "#/components/schemas/ProjectSummary"}
    ProjectVisibilityUpdate:
      type: object
      additionalProperties: false
      required: [visibility]
      properties:
        visibility: {$ref: "#/components/schemas/ProjectVisibility"}
    FeaturedProjectsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 3
          description: Featured projects in position order; positions are 1..n without gaps.
          items:
            type: object
            required: [project_id, position]
            properties:
              project_id: {type: string, format: uuid}
              position: {type: integer, minimum: 1, maximum: 3}
    FeaturedReorderRequest:
      type: object
      additionalProperties: false
      required: [project_ids]
      properties:
        project_ids:
          type: array
          maxItems: 3
          uniqueItems: true
          description: >-
            The complete current featured set in the new order, as canonical
            UUIDs; any other form gives 422 VALIDATION_ERROR.
          items: {type: string, format: uuid}
  responses:
    ValidationError:
      description: >-
        VALIDATION_ERROR — request failed validation. `details.fields` lists
        each failing field location and error type; input values are never
        echoed.
      headers:
        X-Request-ID: {$ref: "#/components/headers/X-Request-ID"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example:
            error:
              code: VALIDATION_ERROR
              message: Invalid request
              details:
                fields:
                  - {loc: [body, title], type: string_too_long}
              request_id: 3f1c2a9e-8f7b-4c1d-9a7e-2b6f0c4d5e61
    NotFound:
      description: >-
        NOT_FOUND — missing, another user's or malformed id; the same body as
        an unknown URL (only request_id differs)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Project:
      description: Own project
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ProjectResponse"}
    FeaturedProjects:
      description: Featured projects after the change
      content:
        application/json:
          schema: {$ref: "#/components/schemas/FeaturedProjectsResponse"}
    ProjectIncomplete:
      description: PROJECT_INCOMPLETE — fields required for publication are empty
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example:
            error:
              code: PROJECT_INCOMPLETE
              message: Project is missing fields required for publication
              details:
                missing_fields: [summary, technologies]
              request_id: 3f1c2a9e-8f7b-4c1d-9a7e-2b6f0c4d5e61
    ProjectTransitionInvalid:
      description: >-
        PROJECT_TRANSITION_INVALID — the action is not allowed in the current
        state; details.status is the current lifecycle state
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example:
            error:
              code: PROJECT_TRANSITION_INVALID
              message: Action is not allowed in the current project state
              details: {status: DRAFT}
              request_id: 3f1c2a9e-8f7b-4c1d-9a7e-2b6f0c4d5e61
    OwnProfile:
      description: Own profile
      content:
        application/json:
          schema: {$ref: "#/components/schemas/OwnProfileResponse"}
    Unauthorized:
      description: UNAUTHORIZED — no, unknown or expired session
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    OriginInvalid:
      description: >-
        CSRF_ORIGIN_INVALID — the Origin header is missing or is not the
        frontend origin. Carries Vary: Origin and X-Request-ID, never
        Access-Control-Allow-Origin.
      headers:
        X-Request-ID: {$ref: "#/components/headers/X-Request-ID"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    ProfileIncomplete:
      description: PROFILE_INCOMPLETE — required publication fields are empty
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example:
            error:
              code: PROFILE_INCOMPLETE
              message: Profile is missing fields required for publication
              details:
                missing_fields: [display_name, headline]
              request_id: 3f1c2a9e-8f7b-4c1d-9a7e-2b6f0c4d5e61
    GitHubRepositoryAlreadyLinked:
      description: >-
        GITHUB_REPOSITORY_ALREADY_LINKED — another of the user's projects
        links this repository; details.project_id
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    GitHubUnavailable:
      description: >-
        GITHUB_UNAVAILABLE — GitHub timed out, answered with an error status or
        an unexpected body; GitHub's response is not copied into the error.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    GitHubLoginOutdated:
      description: >-
        GITHUB_LOGIN_OUTDATED — GitHub has no user with the login stored at
        sign-in, or that login now belongs to another GitHub account: it was
        renamed since sign-in; signing in again refreshes it (ADR-017).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    GitHubUserLimitReached:
      description: >-
        GITHUB_USER_LIMIT_REACHED — the user's GitHub request budget for the
        last 60 minutes does not cover this operation; GitHub was not called;
        details.retry_after_seconds (ADR-018).
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    GitHubRateLimited:
      description: >-
        GITHUB_RATE_LIMITED — the platform's GitHub request budget is
        exhausted; details.retry_after_seconds (ADR-018).
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InternalError:
      description: INTERNAL_ERROR — unexpected server error; no internal details are returned.
      headers:
        X-Request-ID: {$ref: "#/components/headers/X-Request-ID"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
