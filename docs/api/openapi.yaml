openapi: 3.0.3
info:
  title: Developer Professional Profile Platform API
  version: 1.0.0
  description: Preliminary V1 API contract.
servers:
  - url: /api/v1
paths:
  /auth/github/login:
    get:
      summary: Start GitHub OAuth login
      description: Sets the HttpOnly `oauth_state` cookie and redirects to GitHub.
      responses:
        "302": {description: Redirect to GitHub}
        "500": {$ref: "#/components/responses/InternalError"}
  /auth/github/callback:
    get:
      summary: GitHub OAuth login callback
      description: >-
        On success sets the session cookie and redirects to the frontend. The
        `oauth_state` cookie is deleted on every response, including errors.
      parameters:
        - {name: code, in: query, required: false, schema: {type: string}}
        - {name: state, in: query, required: false, schema: {type: string}}
        - {name: error, in: query, required: false, schema: {type: string}}
      responses:
        "302": {description: Redirect to the frontend after login}
        "400":
          description: >-
            ACCESS_DENIED, INVALID_STATE, MISSING_CODE or OAUTH_CODE_INVALID
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500": {$ref: "#/components/responses/InternalError"}
        "502":
          description: >-
            GITHUB_UNAVAILABLE — GitHub timed out, returned an error status, or
            returned an unexpected response
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /auth/logout:
    post:
      summary: Logout
      description: Deletes the current session (if any) and clears the session cookie.
      responses:
        "204": {description: Logged out}
        "500": {$ref: "#/components/responses/InternalError"}
  /auth/me:
    get:
      summary: Current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MeResponse"}
        "401":
          description: UNAUTHORIZED — no valid session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500": {$ref: "#/components/responses/InternalError"}
  /profile:
    get:
      summary: Get own profile
      responses:
        "200": {description: Profile}
    patch:
      summary: Update own profile
      responses:
        "200": {description: Updated profile}
  /profile/publish:
    post:
      summary: Publish profile
      responses:
        "200": {description: Published}
  /profile/unpublish:
    post:
      summary: Unpublish profile
      responses:
        "200": {description: Unpublished}
  /public/profiles/{slug}:
    get:
      summary: Get public profile
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {description: Public profile}
        "404": {description: Not found}
  /projects:
    get:
      summary: List own projects
      responses:
        "200": {description: Projects}
    post:
      summary: Create project
      responses:
        "201": {description: Project created}
  /projects/{id}:
    get:
      summary: Get project
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Project}
        "404": {description: Not found}
    patch:
      summary: Update project
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Updated}
    delete:
      summary: Delete project
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Deleted}
  /projects/{id}/showcase:
    post:
      summary: Create showcase
      responses:
        "201": {description: Created}
    patch:
      summary: Update showcase
      responses:
        "200": {description: Updated}
    delete:
      summary: Delete showcase
      responses:
        "204": {description: Deleted}
  /profile/featured-projects/reorder:
    post:
      summary: Reorder featured projects
      responses:
        "200": {description: Reordered}
  /integrations/github/connect:
    get:
      summary: Start GitHub OAuth
      responses:
        "302": {description: Redirect}
  /integrations/github/callback:
    get:
      summary: GitHub OAuth callback
      responses:
        "302": {description: Redirect}
  /integrations/github/repositories:
    get:
      summary: List repositories
      responses:
        "200": {description: Repositories}
  /integrations/github/repositories/{id}/import:
    post:
      summary: Import repository
      responses:
        "201": {description: Imported project}
  /integrations/github/repositories/{id}/sync:
    post:
      summary: Sync repository
      responses:
        "202": {description: Sync accepted}
  /integrations/github:
    delete:
      summary: Disconnect GitHub
      responses:
        "204": {description: Disconnected}
  /analytics/events:
    post:
      summary: Track analytics event
      responses:
        "202": {description: Event accepted}
  /analytics/profile:
    get:
      summary: Profile analytics
      responses:
        "200": {description: Analytics}
  /analytics/projects/{id}:
    get:
      summary: Project analytics
      responses:
        "200": {description: Analytics}
components:
  headers:
    X-Request-ID:
      description: >-
        Request id. Taken from the request's X-Request-ID header when it is a
        canonical UUID, otherwise generated. Present on every response.
      schema: {type: string, format: uuid}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, request_id]
          properties:
            code: {type: string, example: VALIDATION_ERROR}
            message: {type: string, example: Invalid request}
            details: {type: object, additionalProperties: true}
            request_id:
              type: string
              format: uuid
              description: Same value as the X-Request-ID response header.
    MeResponse:
      type: object
      required: [id, github_login, email, profile_slug]
      properties:
        id: {type: string, format: uuid}
        github_login: {type: string}
        email: {type: string, nullable: true}
        profile_slug: {type: string, nullable: true}
  responses:
    ValidationError:
      description: >-
        VALIDATION_ERROR — request failed validation. `details.fields` lists
        each failing field location and error type; input values are never
        echoed.
      headers:
        X-Request-ID: {$ref: "#/components/headers/X-Request-ID"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          example:
            error:
              code: VALIDATION_ERROR
              message: Invalid request
              details:
                fields:
                  - {loc: [path, id], type: uuid_parsing}
              request_id: 3f1c2a9e-8f7b-4c1d-9a7e-2b6f0c4d5e61
    InternalError:
      description: INTERNAL_ERROR — unexpected server error; no internal details are returned.
      headers:
        X-Request-ID: {$ref: "#/components/headers/X-Request-ID"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
