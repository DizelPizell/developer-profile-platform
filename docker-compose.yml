services:
  postgres:
    image: postgres:17-alpine
    container_name: developer-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Applies the migrations once per `up` and exits; the backend starts only
  # after it succeeds. It runs the image built for the backend service.
  migrate:
    image: ${COMPOSE_PROJECT_NAME}-backend
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    container_name: developer-platform-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The GitHub sync worker (ADR-018): one process on the backend's image. SIGTERM
  # ends it after the current job, hence the grace period.
  github-worker:
    image: ${COMPOSE_PROJECT_NAME}-backend
    pull_policy: never
    container_name: developer-platform-github-worker
    command: ["python", "-m", "app.github.worker"]
    restart: unless-stopped
    stop_grace_period: 90s
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # The worker does not call the API. This link makes
      # `up --build github-worker` build the image, which only backend can do.
      backend:
        condition: service_started

volumes:
  postgres_data:
