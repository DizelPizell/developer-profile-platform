services:
  postgres:
    image: postgres:17-alpine
    container_name: developer-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Applies the migrations once per `up` and exits; the backend starts only
  # after it succeeds. It runs the image built for the backend service.
  migrate:
    image: ${COMPOSE_PROJECT_NAME}-backend
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    container_name: developer-platform-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
