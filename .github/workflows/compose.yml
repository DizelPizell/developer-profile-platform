name: Compose

on:
  push:
    paths:
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "nginx/**"
      - ".env.example"
      - ".github/workflows/compose.yml"
      - ".github/scripts/check_compose.py"
      - ".github/scripts/check_nginx.sh"
      - "deploy.sh"
      - ".github/scripts/check_deploy.sh"
      - "backup/**"
      - ".github/scripts/check_backup.sh"
  # Every check runs on every pull request: a required check that never starts
  # blocks the merge (step 9.4).
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check the Compose file
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use the example environment
        run: cp .env.example .env

      - name: Validate
        run: docker compose config -q

      - name: Check the worker service
        run: python3 .github/scripts/check_compose.py

      - name: Validate with the production file
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q

      - name: Check the production services
        run: python3 .github/scripts/check_compose.py --production

      - name: Check the Nginx configuration
        run: |
          docker build -t nginx-check nginx
          docker run --rm -e SERVER_NAME=example.com nginx-check nginx -t

      - name: Check how Nginx answers
        run: sh .github/scripts/check_nginx.sh nginx-check

      # shellcheck is installed on the GitHub runner image.
      - name: Lint the shell scripts
        run: shellcheck deploy.sh backup/*.sh .github/scripts/check_deploy.sh .github/scripts/check_backup.sh

      - name: Check the deploy script
        run: sh .github/scripts/check_deploy.sh

      # A backup that was never restored is not a backup (ADR-0026).
      - name: Back up and restore
        run: |
          docker build -t backup-check backup
          sh .github/scripts/check_backup.sh backup-check
